<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crossover War</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="board"></canvas>

    <!-- LOBBY -->
    <div id="lobby" class="overlay">
      <div class="panel">
        <h1 class="title">Crossover War</h1>
        <p class="tag">A serverless, peer-to-peer turn-based skirmish.</p>

        <label>
          Your name
          <input id="name-input" type="text" maxlength="16" placeholder="Commander" />
        </label>

        <!-- Profile + flag editor. Lets the player pick a flag (three
             colours, stripe direction, emblem + emblem colour) and save it
             under a named profile in localStorage so future sessions
             remember it. -->
        <details id="profile-editor" class="profile-editor" open>
          <summary>
            <span class="summary-label">Profile &amp; flag</span>
            <canvas id="profile-summary-preview" width="80" height="51"></canvas>
          </summary>
          <div class="profile-editor-body">
            <div class="row">
              <label class="grow">
                Saved profiles
                <select id="profile-select"></select>
              </label>
              <button id="profile-save" class="small" title="Save flag under the current name (creates a new profile or overwrites the matching one)">Save</button>
              <button id="profile-delete" class="small danger" title="Delete the profile matching the current name">Delete</button>
            </div>

            <div class="tab-strip" role="tablist">
              <button type="button" class="tab-btn active" data-tab="flag" role="tab">Flag</button>
              <button type="button" class="tab-btn" data-tab="kingdom" role="tab">Kingdom</button>
            </div>

            <div class="tab-pane active" data-tab="flag" role="tabpanel">
              <div class="flag-preview-row">
                <canvas id="flag-preview-canvas" width="200" height="128"></canvas>
                <div class="flag-controls">
                  <label>
                    Stripe direction
                    <select id="flag-stripe">
                      <option value="horizontal">Horizontal</option>
                      <option value="vertical">Vertical</option>
                      <option value="diagonal">Diagonal</option>
                    </select>
                  </label>
                  <label>
                    Emblem
                    <select id="flag-emblem"></select>
                  </label>
                  <label>
                    Emblem position
                    <select id="flag-emblem-position">
                      <option value="center">Centre</option>
                      <option value="top-left">Top-left</option>
                      <option value="top-right">Top-right</option>
                      <option value="bottom-left">Bottom-left</option>
                      <option value="bottom-right">Bottom-right</option>
                    </select>
                  </label>
                  <label class="slider-label">
                    Emblem size <output id="flag-emblem-size-value">60%</output>
                    <input id="flag-emblem-size" type="range" min="15" max="100" step="5" value="60" />
                  </label>
                </div>
              </div>

              <div class="colour-grid">
                <label>
                  Colour 1
                  <input id="flag-colour-1" type="color" value="#c81428" />
                </label>
                <label>
                  Colour 2
                  <input id="flag-colour-2" type="color" value="#ffffff" />
                </label>
                <label>
                  Colour 3
                  <input id="flag-colour-3" type="color" value="#1a4a8a" />
                </label>
                <label>
                  Emblem colour
                  <input id="flag-emblem-colour" type="color" value="#d4a834" />
                </label>
              </div>
            </div>

            <div class="tab-pane" data-tab="kingdom" role="tabpanel">
              <div id="kingdom-picker" class="kingdom-picker"></div>
            </div>
          </div>
        </details>

        <div id="lobby-host">
          <div class="row">
            <button id="host-btn" class="primary">Host new game</button>
            <button id="host-load-btn">Load saved game</button>
          </div>
          <div id="saved-games" class="saved-games hidden"></div>
        </div>

        <div id="lobby-divider" class="divider"><span>or</span></div>

        <div id="lobby-join">
          <label>
            Room link or code
            <input id="join-code" type="text" maxlength="500" placeholder="paste room link or code…" />
          </label>
          <div class="row">
            <button id="join-btn" class="primary">Join game</button>
          </div>
        </div>

        <div id="lobby-status" class="status"></div>
      </div>
    </div>

    <!-- WAITING ROOM -->
    <div id="waiting" class="overlay hidden">
      <div class="panel">
        <h2>Waiting room</h2>
        <p>Share this link — friends can join right from a browser:</p>
        <div class="code-box">
          <code id="room-code"></code>
          <button id="copy-code" class="small">Copy link</button>
        </div>
        <h3>Players</h3>
        <ul id="player-list"></ul>
        <div id="cpu-controls" class="row" style="margin-bottom:8px">
          <button id="add-cpu-btn" class="small">+ Add computer player</button>
        </div>
        <div id="host-controls">
          <label id="map-size-row" class="setting-row">
            <span class="setting-label">Map size</span>
            <select id="map-size-select">
              <option value="64" selected>64 × 64</option>
              <option value="128">128 × 128</option>
              <option value="256">256 × 256</option>
            </select>
          </label>
          <label class="setting-row slider-row" id="min-castles-row">
            <span class="setting-label">Minimum castles</span>
            <input id="min-castles" type="range" min="1" max="8" step="1" value="2" />
            <output id="min-castles-value">2</output>
          </label>
          <label class="setting-row slider-row" id="max-castles-row">
            <span class="setting-label">Maximum castles</span>
            <input id="max-castles" type="range" min="1" max="8" step="1" value="2" />
            <output id="max-castles-value">2</output>
          </label>
          <label class="setting-row slider-row" id="min-biomes-row">
            <span class="setting-label">Minimum additional biomes</span>
            <input id="min-biomes" type="range" min="0" max="8" step="1" value="0" />
            <output id="min-biomes-value">0</output>
          </label>
          <label class="setting-row slider-row" id="max-biomes-row">
            <span class="setting-label">Maximum additional biomes</span>
            <input id="max-biomes" type="range" min="0" max="8" step="1" value="2" />
            <output id="max-biomes-value">2</output>
          </label>
          <div class="setting-row threshold-row" id="threshold-row">
            <span class="setting-label">Sea / Land / Mountain</span>
            <div class="threshold-slider" id="threshold-slider" data-sea="0.40" data-mountain="0.725">
              <div class="threshold-region threshold-sea" id="threshold-region-sea"></div>
              <div class="threshold-region threshold-land" id="threshold-region-land"></div>
              <div class="threshold-region threshold-mountain" id="threshold-region-mountain"></div>
              <div class="threshold-handle" id="threshold-handle-sea" data-handle="sea" title="Sea / Land threshold"></div>
              <div class="threshold-handle" id="threshold-handle-mountain" data-handle="mountain" title="Land / Mountain threshold"></div>
            </div>
            <output id="threshold-value">40% · 72%</output>
          </div>
          <div class="row start-row">
            <button id="start-btn" class="primary">Start game</button>
          </div>
        </div>
        <p class="tag" id="waiting-tag">Need at least 2 players to start.</p>
      </div>
    </div>

    <!-- GAME SHELL — populated at runtime by hudOverlay.js -->
    <div id="game-ui" class="hidden"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
